    <title>Frame Kit</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "Frame Kit",
        "description": "Frame Kit is a React UI kit for building precise creative and productivity tools. A project by Present Standards.",
        "url": "https://framekit.presentstandards.studio/",
        "creator": {
          "@type": "Organization",
          "name": "Present Standards",
          "sameAs": "https://www.instagram.com/presentstandards.studio/"
        },
        "codeRepository": "https://github.com/j-wrigley/Frame-Kit",
        "sameAs": [
          "https://github.com/j-wrigley/Frame-Kit",
          "https://www.npmjs.com/package/@presentstandards/framekit-ui",
          "https://www.instagram.com/presentstandards.studio/"
        ],
        "programmingLanguage": ["TypeScript", "CSS"],
        "license": "https://opensource.org/licenses/MIT"
      }
    </script>
    <script>
      // Apply the saved theme and accent preset before first paint.
      // (Custom accents are theme-derived and re-apply after mount.)
      try {
        if (localStorage.getItem('fk-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
        var fkAccent = localStorage.getItem('fk-accent');
        if (fkAccent && fkAccent !== 'graphite') {
          document.documentElement.dataset.accent = fkAccent;
        }
        // Style previews intentionally start in Base on every fresh load.
        localStorage.removeItem('fk-style');
      } catch (e) {}
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
